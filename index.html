cols.forEach(([f,l])=>{k.add(new Option("Sort by: "+l,f));const t=document.createElement("th");t.textContent=l;t.onclick=()=>{key=f;k.value=f;draw()};h.appendChild(t)});
function draw(){
document.getElementById("asc").className=dir>0?"on":"";document.getElementById("desc").className=dir<0?"on":"";
const s=q.value.toLowerCase();
const L=R.filter(r=>(r.c+r.n).toLowerCase().includes(s)).sort((a,b)=>(typeof a[key]=="number"?a[key]-b[key]:a[key].localeCompare(b[key]))*dir);

document.getElementById("desc").onclick=()=>{dir=-1;draw()};
draw();

const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

document.getElementById("csv").onclick=()=>{const q2=v=>'"'+String(v).replace(/"/g,'""')+'"';

save("capitals-weather.csv","\ufeff"+rows.join("\n"))};

save("capitals-weather-xml.txt",x)};
